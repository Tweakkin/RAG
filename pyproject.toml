[project]
name = "rag-against-the-machine"
version = "1.0.0"
description = "Local retrieval-augmented question answering over vLLM."
requires-python = ">=3.10"
dependencies = [
    "fire>=0.7,<1",
    "pydantic>=2.8,<3",
    "torch>=2.6,<3",
    "tqdm>=4.66,<5",
    "transformers>=4.57,<5",
]

[dependency-groups]
dev = ["flake8>=7,<8", "mypy>=1.11,<2"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.mypy]
exclude = ["^data/", "^datasets_public/", "^info/", "^\\.venv/"]
